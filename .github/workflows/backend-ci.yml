# Pipeline CI du backend GreenRoots.
# Ce workflow GitHub Actions démarre l’environnement Docker de test,
# réinitialise la base PostgreSQL dédiée aux tests automatisés,
# applique les migrations Prisma puis exécute les tests du backend dans le conteneur `greenroots-backend-test`.


name: Backend CI

on:
  push:
    branches:
      - DEV
      - ci/setup-github-actions

  pull_request:
    branches:
      - DEV

jobs:
  backend-test:
    runs-on: ubuntu-latest

    # Variables utilisées par Docker Compose pendant la CI.
    env:
      POSTGRES_USER: greenroots
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: greenroots
      DATABASE_URL: postgresql://greenroots:testpassword@db:5432/greenroots

      POSTGRES_TEST_USER: greenroots
      POSTGRES_TEST_PASSWORD: testpassword
      POSTGRES_TEST_DB: greenroots_test
      TEST_DATABASE_URL: postgresql://greenroots:testpassword@db-test:5432/greenroots_test

    steps:
      # Récupère le code du dépôt GitHub.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Démarre les services Docker nécessaires aux tests.
      - name: Build and start Docker services
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: List Docker containers
        run: docker ps -a

      # Réinitialise la base de test pour garantir un état propre.
      - name: Reset test database
        run: docker exec greenroots-backend-test npx prisma migrate reset --force --skip-seed

      # Lance les tests automatisés du backend.
      - name: Run backend tests
        run: docker exec greenroots-backend-test npm test