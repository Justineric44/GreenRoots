openapi: 3.0.0
info:
  title: Users module
  version: 1.0.0

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 14 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        type:
          type: string
          enum: [particulier, entreprise, association]
        address: { type: string }
        postalCode: { type: string }
        city: { type: string }
        phone: { type: string, nullable: true }
        siret: { type: string, nullable: true }
        companyName: { type: string, nullable: true }

    OrderItem:
      type: object
      properties:
        id: { type: integer }
        treeCommonName: { type: string }
        quantity: { type: integer }
        unitPrice: { type: string }
        treeId: { type: integer }
        projectId: { type: integer }
        project:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }

    Order:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [validated, canceled] }
        amount: { type: string }
        userId: { type: integer }
        cartId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

paths:
  /api/users/me:
    get:
      tags: [Users]
      summary: Profil de l'utilisateur connecté
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profil retourné
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { description: Non authentifié }

    put:
      tags: [Users]
      summary: Mise à jour partielle du profil
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lastName: { type: string }
                firstName: { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Profil mis à jour
        '400': { description: Body invalide }
        '401': { description: Non authentifié }

    delete:
      tags: [Users]
      summary: Suppression (anonymisation) du compte
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Compte anonymisé }
        '401': { description: Non authentifié }

  /api/users/me/orders:
    get:
      tags: [Users]
      summary: Historique des commandes
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Liste des commandes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }

  /api/users/me/orders/{id}:
    get:
      tags: [Users]
      summary: Détail d'une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Détail de la commande
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404':
          description: Commande introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
