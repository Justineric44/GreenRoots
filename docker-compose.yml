services:
  db:
    image: postgres:17-alpine
    container_name: greenroots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenroots
      POSTGRES_PASSWORD: 2Cjwf
      POSTGRES_DB: greenroots
    ports:
      - '5432:5432'
    volumes:
      - greenroots-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenroots']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: greenroots-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://greenroots:2Cjwf@db:5432/greenroots?schema=public'
      PORT: 3001
      
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  greenroots-data:
